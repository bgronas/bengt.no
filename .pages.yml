# Pages CMS configuration. GENERATED by scripts/sync_cms_schema.py from
# data/taxonomy-policy.yaml and data/automation-policy.yaml. Do not edit by hand:
# change the policy or the script, then run  ./publish.sh cms-sync
#
# Git is the source of truth. Pages CMS commits to this repository through its
# GitHub App; the same GitHub Actions workflow then processes the content.
# Saving in the CMS is a commit, not a deployment. See docs/cms.md.
media:
- name: intake
  label: Intake media
  input: inbox/media
  output: inbox/media
  extensions:
  - png
  - jpg
  - jpeg
  - webp
  - gif
  - svg
  rename: safe
content:
- name: intake_no
  label: New article (Norsk)
  type: collection
  path: inbox/no
  format: yaml-frontmatter
  filename:
    template: '{primary}.md'
    field: false
  subfolders: false
  operations:
    rename: false
    delete: false
  view:
    fields:
    - title
    primary: title
    sort:
    - title
  fields:
  - name: title
    label: Content · Title
    type: string
    required: true
    options:
      maxlength: 110
    description: Saved here, the article is imported into a page bundle by the next workflow run and stays a draft. Continue editing it under Articles afterwards, not here.
  - name: slug
    label: Content · Slug (optional)
    type: string
    pattern:
      regex: ^$|^[a-z0-9]+(-[a-z0-9]+)*$
      message: Lower-case letters, digits and single hyphens.
    description: Address of the article. Leave empty to derive it from the title. It cannot be changed after publication.
  - name: translationKey
    label: Content · Translation key (optional)
    type: string
    description: 'Only when this is a translation of an existing article: copy that article''s translation key.'
  - name: summary
    label: Content · Summary
    type: text
    options:
      maxlength: 320
  - name: body
    label: Content · Body (Markdown source)
    type: code
    options:
      format: markdown
    description: 'Markdown source. Reference an uploaded image by its file name: ![Alt text](diagram.png).'
  - name: hero
    label: Media · Hero image (optional)
    type: image
    options:
      media: intake
      extensions:
      - jpg
      - jpeg
      - png
      - webp
    description: Copied into the article as feature.<ext>. Without one, a typographic title card is generated.
  - name: categories
    label: Taxonomy · Categories
    type: select
    description: 1 to 2 categories. The list is defined in data/taxonomy-policy.yaml.
    options:
      multiple: true
      min: 0
      max: 2
      values:
      - Technology
      - Sustainability
      - Cloud Native
      - Orchestration
      - Datacenter Management
      - Home Automation
      - Personal
  - name: tags
    label: Taxonomy · Tags
    type: select
    description: Up to 7 canonical tags. A new tag must first be added to data/taxonomy-policy.yaml.
    options:
      multiple: true
      max: 7
      values:
      - Hugo
      - Blowfish
      - GitHub Actions
      - Markdown
      - Python
      - Web Performance
      - Accessibility
      - Home Assistant
      - Kubernetes
      - AI
      - GitOps
  - name: series
    label: Taxonomy · Series
    type: string
    list:
      max: 1
    description: Optional. One series name, written identically in every part.
  - name: series_order
    label: Taxonomy · Part number in the series
    type: number
    options:
      min: 1
    description: Required when a series is set. Parts are ordered by this number.
  - name: auto_enrich
    label: Automation · Generate missing metadata
    type: boolean
    default: true
    description: When on, the workflow sends the article text to the Anthropic API (billed to the API key) and fills in description, summary, keywords, categories and tags. It switches itself off after a valid result.
  - name: auto_translate
    label: Automation · Request a translation draft
    type: boolean
    default: false
    description: When on, the workflow creates a draft in the other language through the Anthropic API. The result is always a draft marked as an unreviewed machine translation; it is never published automatically.
