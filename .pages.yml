- name: posts_no
  label: Articles (Norsk)
  type: collection
  path: content/no/posts
  format: yaml-frontmatter
  filename:
    template: '{year}-{month}-{day}-{primary}/index.md'
    field: false
  operations:
    create: false
    rename: false
    delete: false
  view:
    layout: tree
    node:
      filename: index.md
      hideDirs: nodes
    fields:
    - title
    - date
    - draft
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Content · Title
    type: string
    required: true
    options:
      maxlength: 110
    description: Changing the title never changes the address or the folder of the article.
  - name: body
    label: Content · Body (Markdown source)
    type: code
    options:
      format: markdown
    description: Markdown source, saved exactly as typed. Images are files in the article folder, referenced by name.
  - name: summary
    label: Content · Summary (article cards)
    type: text
    options:
      maxlength: 320
  - name: description
    label: Content · Description (search results)
    type: text
    options:
      maxlength: 160
    description: 150 to 160 characters. Leave empty with metadata generation on.
  - name: keywords
    label: Content · Keywords
    type: string
    list:
      max: 8
  - name: slug
    label: Content · Slug
    type: string
    readonly: true
    description: The public address. Fixed after creation.
  - name: translationKey
    label: Content · Translation key
    type: string
    readonly: true
    description: Articles in two languages with the same key are linked as translations.
  - name: draft
    label: Publication · Draft
    type: boolean
    default: true
    description: 'On: excluded from the site. Off: published by the next successful deployment.'
  - name: date
    label: Publication · Date
    type: date
    required: true
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm:ssxxx
    description: A future date keeps the article out of the site until a deployment after that time.
  - name: lastmod
    label: Publication · Last meaningful update
    type: date
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm:ssxxx
  - name: expiryDate
    label: Publication · Expiry (optional)
    type: date
    default: ''
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm:ssxxx
    description: After this time the article is removed by the next deployment.
  - name: featured
    label: Publication · Featured on the homepage
    type: boolean
    default: false
    description: The single switch for the Featured section.
  - name: featured_weight
    label: Publication · Featured order (optional)
    type: number
    description: Lower numbers come first. Without a number, newer articles come first.
  - name: categories
    label: Taxonomy · Categories
    type: select
    description: 1 to 2 categories. The list is defined in data/taxonomy-policy.yaml.
    options:
      multiple: true
      min: 0
      max: 2
      values:
      - Technology
      - Sustainability
      - Cloud Native
      - Orchestration
      - Datacenter Management
      - Home Automation
      - Personal
  - name: tags
    label: Taxonomy · Tags
    type: select
    description: Up to 7 canonical tags. A new tag must first be added to data/taxonomy-policy.yaml.
    options:
      multiple: true
      max: 7
      values:
      - Hugo
      - Blowfish
      - GitHub Actions
      - Markdown
      - Python
      - Web Performance
      - Accessibility
      - Home Assistant
      - Kubernetes
      - AI
      - GitOps
  - name: series
    label: Taxonomy · Series
    type: string
    list:
      max: 1
    description: Optional. One series name, written identically in every part.
  - name: series_order
    label: Taxonomy · Part number in the series
    type: number
    options:
      min: 1
    description: Required when a series is set. Parts are ordered by this number.
  - name: auto_enrich
    label: Automation · Generate missing metadata
    type: boolean
    default: false
    description: When on, the workflow sends the article text to the Anthropic API (billed to the API key) and fills in description, summary, keywords, categories and tags. It switches itself off after a valid result.
  - name: auto_translate
    label: Automation · Request a translation draft
    type: boolean
    default: false
    description: When on, the workflow creates a draft in the other language through the Anthropic API. The result is always a draft marked as an unreviewed machine translation; it is never published automatically.
  - name: translation_reviewed
    label: Automation · Machine translation reviewed
    type: boolean
    default: false
    description: 'Only for articles created by the translation engine: switch on after you have reviewed the text. An unreviewed machine translation cannot be published.'
  - name: showHero
    label: Media · Show the feature image above the article
    type: boolean
    default: false
    description: Off by default. Use for photographs, not for generated title cards.
  - name: featureimage
    label: Media · Feature image file (optional)
    type: string
    description: File name inside the article folder. Needed only when the folder holds more than one of feature.*, cover.*, hero.*.
  - name: social
    label: Social drafts
    type: object
    description: Drafts for LinkedIn and X are written after deployment and stored as workflow artifacts under Actions > Publish > latest run > Artifacts. Nothing is posted.
    fields:
    - name: enabled
      label: Write drafts for this article
      type: boolean
      default: true
      description: On by default.
    - name: language
      label: Draft language
      type: select
      default: inherit
      options:
        values:
        - inherit
        - 'no'
        - en
    - name: regenerate
      label: Regenerate on the next deployment
      type: boolean
      default: false
      description: Switch on to request new drafts for the current text. The workflow switches it off again once the drafts exist.
