[project]
name = "bengt-no-site"
version = "1.0.0"
description = "Editorial automation for bengt.no (Hugo + Blowfish, Git-native CMS)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8,<3",
    "httpx>=0.28,<1",
    # Hugo Extended, pinned exactly. Must stay inside the range supported by the
    # pinned Blowfish release (themes/blowfish/config.toml). See docs/operations.md.
    "hugo==0.169.0",
    "jsonschema>=4.26,<5",
    "markdown-it-py>=4.3,<5",
    "pillow>=13,<14",
    "pydantic>=2.14,<3",
    "python-frontmatter>=1.3,<2",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "check-jsonschema>=0.39",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-jsonschema",
    "types-pyyaml",
]
# Optional: only for the browser smoke test and design-review screenshots.
#   uv sync --group browser && uv run playwright install chromium
browser = [
    "playwright>=1.65",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q --strict-markers"
markers = [
    "hugo: builds a real Hugo site (slower)",
    "api: opt-in live Anthropic smoke test (needs ANTHROPIC_API_KEY and RUN_API_SMOKE=1)",
    "browser: opt-in Playwright smoke test (needs RUN_BROWSER_SMOKE=1)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["themes", "public", "resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S", "PTH"]
ignore = ["E501", "S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
mypy_path = "scripts"
files = ["scripts"]
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["frontmatter", "frontmatter.*"]
ignore_missing_imports = true
