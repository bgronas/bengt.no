[project]
name = "bengt-no-site"
version = "1.0.0"
description = "Editorial automation for bengt.no (Hugo + Blowfish, Git-native CMS)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "hugo",
    "jsonschema",
    "markdown-it-py",
    "pillow",
    "pydantic",
    "python-frontmatter",
    "pyyaml",
]

[dependency-groups]
dev = [
    "check-jsonschema",
    "mypy",
    "pytest",
    "ruff",
    "types-jsonschema",
    "types-pyyaml",
]
browser = [
    "playwright",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q --strict-markers"
markers = [
    "hugo: builds a real Hugo site (slower)",
    "api: opt-in live Anthropic smoke test (needs ANTHROPIC_API_KEY and RUN_API_SMOKE=1)",
    "browser: opt-in Playwright smoke test (needs RUN_BROWSER_SMOKE=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["themes", "public", "resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S", "PTH"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
mypy_path = "scripts"
files = ["scripts"]
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["frontmatter", "frontmatter.*"]
ignore_missing_imports = true
