name: Set up tools
description: Installs uv, the pinned Python and the locked dependencies (including Hugo Extended) from uv.lock.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.11.32"
        enable-cache: "true"
        cache-dependency-glob: uv.lock
    - name: Install locked dependencies
      shell: bash
      run: |
        set -euo pipefail
        uv sync --frozen
        uv run --frozen hugo version
